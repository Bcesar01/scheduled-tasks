name: Test Setup

on:
  workflow_dispatch:  # Trigger manual

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check secrets are configured
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        run: |
          if [ -z "$GMAIL_EMAIL" ]; then
            echo "GMAIL_EMAIL secret is not set!"
            exit 1
          fi

          if [ -z "$GMAIL_PASSWORD" ]; then
            echo "GMAIL_PASSWORD secret is not set!"
            exit 1
          fi

          echo "All secrets are configured!"

      - name: Check required files exist
        run: |
          if [ ! -f "main.py" ] || [ ! -f "requirements.txt" ] || [ ! -f "birthdays.csv" ]; then
            echo "Required files missing!"
            exit 1
          fi
          echo "All required files found!"

      - name: Test Python syntax
        run: python -m py_compile main.py && echo "Python syntax OK"

      # Passo que faltava para executar o código enviando as variáveis
      - name: Run main script
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        run: python main.py
